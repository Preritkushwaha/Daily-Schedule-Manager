services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schedule-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: schedule-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
